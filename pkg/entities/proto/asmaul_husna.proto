syntax = "proto3";
package entities;

option go_package = "katou_megumi/pkg/entities/generated";

message AsmaulHusna {
	int32 urutan = 1;
	string latin = 2;
	string arab = 3;
	string arti = 4;
}

message AsmaulHusnaResponse {
	int32 statusCode = 1;
	int32 total = 2;
    repeated AsmaulHusna data = 3;
}

message AsmaulHusnaByLatinOrUrutanResponse  { 
	int32 statusCode = 1;
	int32 total = 2;
    AsmaulHusna data = 3;
}
